aid: parse
name: Parse
description: >-
  Parse is an open-source Backend-as-a-Service (BaaS). Originally the mobile
  backend company founded in 2011, backed by GV and DCVC, and acquired by Facebook
  in 2013 before the hosted parse.com service was shut down in 2017, Parse now lives
  on as the community-maintained Parse Platform. It centers on Parse Server, a
  self-hostable Node.js/Express backend, paired with first-party client SDKs for
  JavaScript, Apple (iOS/macOS), Android, Flutter/Dart, PHP, .NET, Swift and Arduino.
  Parse exposes a documented REST API over HTTP+JSON providing a schemaless object
  store, user authentication and sessions, roles and ACL/class-level permissions,
  file storage, rich queries, Cloud Code, Cloud Code Webhooks, LiveQuery real-time
  subscriptions, analytics and push notifications.
